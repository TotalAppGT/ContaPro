# Railway deployment - ContaPro
# Builds frontend React + backend Express, serves both from same port

[build]
  builder = "nixpacks"

[deploy]
  startCommand = "bash start.sh"

# Railway auto-injects DATABASE_URL when Postgres is attached
# Add these in Railway → Variables:
#   JWT_SECRET = your-secret-key
#   BASE_DOMAIN = totalappgt.online
